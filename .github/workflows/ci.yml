# Checks that the repository is a valid Accountant24 plugin on every change:
# plugin.json parses and follows the app's naming rules, and every skill has a
# SKILL.md with a name and a description. Zero dependencies, nothing to install.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check.mjs
